[package]
name = "semantic-os-x86_64"
version = "0.1.0"
edition = "2021"
authors = ["Semantic OS Contributors"]
description = "Semantic OS Kernel - x86_64 version"

# Keep this out of the parent workspace
[workspace]

[features]
# `interactive`: after the demo suite, drop into the live sem-sh shell reading
# the real keyboard instead of idling (the "shell IS the OS interface" landing).
# ON by default — every bare-metal boot now lands in the shell. For headless
# CI runs that just want the demos and a clean exit, opt out with
# `--no-default-features`.
default = ["interactive"]
interactive = []
# `autocompile`: right before the interactive handoff, headlessly run the
# DEMO 80 compile (`semos-rustc /hello.rs -o /tmp/hello.elf`) and print the
# result to serial. Lets QEMU test the on-device compiler with no keyboard
# (`-serial stdio`). Off by default so normal boots don't spawn the 88 MB
# compiler every time.
autocompile = []

[dependencies]
# Bootloader handles Real→Protected→Long mode transition
bootloader_api = "0.11"

# x86_64 specific utilities
x86_64 = "0.15"

# Spin locks for no_std
spin = "0.9"

# Volatile memory access
volatile = "0.6"

# Bitflags for register manipulation
bitflags = "2.4"

# Shared kernel core (platform-independent)
kernel-core = { path = "../kernel-core" }

# TTF/OTF font parser (M7) — zero-allocation, no_std. We disable the std
# default and rasterize glyph outlines ourselves into the M6 framebuffer.
ttf-parser = { version = "0.25", default-features = false, features = ["no-std-float"] }

# 2D anti-aliased vector rasterizer (M8). no_std + alloc (kernel global
# allocator); std/PNG features off. Renders to an in-heap Pixmap which we
# blit to the M6 framebuffer.
tiny-skia = { version = "0.11", default-features = false, features = ["no-std-float"] }

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
lto = true
opt-level = "z"
# Keep DWARF debug info for GDB-over-QEMU debugging.
# Symbols only land in the on-disk kernel ELF; the bootloader strips them
# from the loaded image, so this has no runtime size impact.
debug = true
strip = false
