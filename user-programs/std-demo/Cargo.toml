[package]
name = "std-demo"
version = "0.1.0"
edition = "2021"

# Opt out of any parent workspace.
[workspace]

[[bin]]
name = "std-demo"
path = "src/main.rs"

[dependencies]
semos-std = { path = "../std-shim" }

[profile.release]
panic = "abort"
# opt-level=0, NOT "z"/1/2 (task #54). Optimization miscompiles the
# std-shim syscall path: at -Oz the File.fd / Mutex / Once paths corrupt;
# at -O1 those recover but SYS_FREAD (read_to_end) still returns garbage.
# Only -O0 passes the whole surface. Root cause is an unresolved codegen
# /residual-UB bug in the syscall wrappers; revisit when minimized.
opt-level = 0
lto = true
strip = true
codegen-units = 1
