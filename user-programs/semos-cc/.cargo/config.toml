[build]
target = "x86_64-unknown-none"

[unstable]
# Don't propagate [build] target to host-context builds (build scripts +
# their deps + proc-macros). With Aug-2026 cargo this gate is enabled by
# PRESENCE — the bare key defaults to `true`; an explicit `= false` now
# parses as "the value false" and ENABLES it anyway, and the old
# `host-config = true` key is gone entirely (host config now lives under
# [host.<triple>] tables, which we don't need: the default host linker,
# cc, is right for build scripts — `rust-lld` there can't find -lm/-ldl).
target-applies-to-host = true
# alloc added for Cranelift — needs Box/Vec/String.
build-std = ["core", "alloc", "compiler_builtins"]
build-std-features = ["compiler-builtins-mem"]

[source.crates-io]
replace-with = "vendored-sources"

[source.vendored-sources]
directory = "vendor"
