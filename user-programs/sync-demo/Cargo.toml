[package]
name = "sync-demo"
version = "0.1.0"
edition = "2021"

# Opt out of any parent workspace.
[workspace]

[[bin]]
name = "sync-demo"
path = "src/main.rs"

[dependencies]
semos-std = { path = "../std-shim" }

[profile.release]
panic = "abort"
# opt-level=0 only — task #54: any optimization miscompiles the std-shim
# syscall path. See std-demo's Cargo.toml for the long-form story.
opt-level = 0
lto = true
strip = true
codegen-units = 1
