[package]
name = "sem-sh"
version = "0.1.0"
edition = "2021"

# Opt out of any parent workspace.
[workspace]

[[bin]]
name = "sem-sh"
path = "src/main.rs"

[dependencies]
semos-std = { path = "../std-shim" }

[profile.release]
panic = "abort"
# opt-level=0, NOT "z"/1/2 (task #54): optimization miscompiles the
# std-shim syscall path. Match every std-shim program.
opt-level = 0
lto = true
strip = true
codegen-units = 1
