[package]
name = "rustc_query_system"
version = "0.0.0"
edition = "2024"

[dependencies]
# tidy-alphabetical-start
rustc_abi = { path = "../rustc_abi" }
rustc_ast = { path = "../rustc_ast" }
rustc_data_structures = { path = "../rustc_data_structures" }
rustc_errors = { path = "../rustc_errors" }
rustc_feature = { path = "../rustc_feature" }
rustc_fluent_macro = { path = "../rustc_fluent_macro" }
rustc_hashes = { path = "../rustc_hashes" }
rustc_hir = { path = "../rustc_hir" }
rustc_index = { path = "../rustc_index" }
rustc_macros = { path = "../rustc_macros" }
rustc_serialize = { path = "../rustc_serialize" }
rustc_session = { path = "../rustc_session" }
rustc_span = { path = "../rustc_span" }
rustc_thread_pool = { path = "../rustc_thread_pool" }
smallvec = { version = "1.8.1", features = ["union", "may_dangle"] }
tracing = { version = "0.1", default-features = false }
# tidy-alphabetical-end

[dependencies.hashbrown]
version = "0.15"
default-features = false
features = ["default-hasher"] # for may_dangle

# Phase 5b Stage E iter 7: parking_lot → parking_lot_core (60 errors,
# no_std-incompatible). Query system is single-threaded on SemOS per
# §1.4; the parking_lot Mutex uses fall back to the
# rustc_data_structures sync shim under cfg(target_os = "none").
[target.'cfg(not(target_os = "none"))'.dependencies]
parking_lot = "0.12"
