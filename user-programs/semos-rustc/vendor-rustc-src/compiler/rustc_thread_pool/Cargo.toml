[package]
name = "rustc_thread_pool"
version = "0.0.0"
authors = [
    "Niko Matsakis <niko@alum.mit.edu>",
    "Josh Stone <cuviper@gmail.com>",
]
description = "Core APIs for Rayon - fork for rustc (M27 SemOS: stubbed to ~50-line single-threaded shim per plan §1.4 + R4 B4)"
license = "MIT OR Apache-2.0"
edition = "2021"
readme = "README.md"
keywords = ["parallel", "thread", "concurrency", "join", "performance"]
categories = ["concurrency"]

# M27 §1.4 + R4 B4: SemOS targets a single-threaded rustc. The rayon
# fork is replaced with a ~50-line shim in src/lib.rs that preserves
# the public API surface (Scope, ThreadPool, ThreadPoolBuilder, join,
# scope, spawn, broadcast, mark_blocked/unblocked, current_thread_index,
# tlv module) but runs everything sequentially. crossbeam-deque /
# crossbeam-utils / smallvec are no longer needed.
[dependencies]

[target.'cfg(target_os = "none")'.dependencies]
semos-std = { path = "../../../../std-shim" }

[dev-dependencies]
