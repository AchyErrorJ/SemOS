# We need to use a separate crate including library/proc_macro as opposed to a
# direct path dependency on library/proc_macro because doing the latter will
# cause two copies of libproc_macro.rlib to end up in the sysroot, breaking
# proc-macro crates. In addition it confuses the workspace_members function of
# bootstrap.

[package]
name = "rustc_proc_macro"
version = "0.0.0"
edition = "2024"

[lib]
# Phase 5b Stage E iter 10: upstream points at ../../library/proc_macro/
# which we don't have (rustc-src vendoring is `compiler/` only, no
# `library/`). Per §1.5 we drop proc-macro runtime entirely; provide
# a tiny local stub that exposes the public API surface as no-op /
# unreachable!() so downstream consumers (rustc_expand, rustc_metadata,
# rustc_builtin_macros) still link.
path = "src/lib_stub.rs"
test = false
doctest = false

[dependencies]
# tidy-alphabetical-start
rustc-literal-escaper = "0.0.7"
# tidy-alphabetical-end

[features]
# tidy-alphabetical-start
rustc-dep-of-std = []
# tidy-alphabetical-end
