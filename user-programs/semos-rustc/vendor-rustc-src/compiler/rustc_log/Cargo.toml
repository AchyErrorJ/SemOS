[package]
name = "rustc_log"
version = "0.0.0"
edition = "2024"

[dependencies]
# tidy-alphabetical-start
tracing = { version = "0.1.41", default-features = false }
# tidy-alphabetical-end

# Phase 5b Stage E iter 6: full tracing stack host-only. The SemOS-target
# rustc_log body is already a stub returning Ok(()); these crates only
# get used on host where they configure stderr logging. tracing-core's
# `std` feature (default) pulls once_cell (245 errors); tracing-subscriber
# pulls parking_lot, anstyle, etc. — the whole std-coupled telemetry stack.
[target.'cfg(not(target_os = "none"))'.dependencies]
tracing-core = "0.1.34"
tracing-subscriber = { version = "0.3.3", default-features = false, features = ["fmt", "env-filter", "smallvec", "parking_lot", "ansi"] }
tracing-tree = "0.3.1"

[features]
# tidy-alphabetical-start
max_level_info = ['tracing/max_level_info', 'tracing/release_max_level_info']
# tidy-alphabetical-end
