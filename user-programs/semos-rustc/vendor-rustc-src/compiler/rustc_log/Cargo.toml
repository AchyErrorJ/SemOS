[package]
name = "rustc_log"
version = "0.0.0"
edition = "2024"

[dependencies]
# tidy-alphabetical-start
# M27 R3: tracing port pending — `tracing`, `tracing-core`, `tracing-subscriber`,
# and `tracing-tree` are all external R3 PATCH crates in the parent's queue.
# They remain declared here so the public API surface (the `tracing` re-export
# in lib.rs) stays present, but the crate body on the SemOS target reduces to
# a stub that returns Ok(()). Once the tracing tree is no_std-patched, swap
# the stub body back to upstream behavior.
tracing = { version = "0.1.41", default-features = false }
tracing-core = "0.1.34"
tracing-subscriber = { version = "0.3.3", default-features = false, features = ["fmt", "env-filter", "smallvec", "parking_lot", "ansi"] }
tracing-tree = "0.3.1"
# tidy-alphabetical-end

[features]
# tidy-alphabetical-start
max_level_info = ['tracing/max_level_info', 'tracing/release_max_level_info']
# tidy-alphabetical-end
