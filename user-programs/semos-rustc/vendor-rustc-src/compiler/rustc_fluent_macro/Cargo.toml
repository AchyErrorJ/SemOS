[package]
name = "rustc_fluent_macro"
version = "0.0.0"
edition = "2024"

[lib]
proc-macro = true

[dependencies]
# Phase 5b Stage E iter 11: fluent-bundle / fluent-syntax /
# annotate-snippets / unic-langid all dropped per §1.8 — fluent.rs
# is now a minimal stub that emits `pub static DEFAULT_LOCALE_RESOURCE`
# + an empty `fluent_generated` module, no parsing or validation.
# Just proc-macro2 + quote (no syn either; we don't parse input).
proc-macro2 = "1"
quote = "1"
