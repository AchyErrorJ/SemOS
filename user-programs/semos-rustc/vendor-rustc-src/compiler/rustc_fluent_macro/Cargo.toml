[package]
name = "rustc_fluent_macro"
version = "0.0.0"
edition = "2024"

[lib]
proc-macro = true

[dependencies]
# tidy-alphabetical-start
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }
# tidy-alphabetical-end

# Phase 5b Stage E iter 9: proc-macro host-only deps. fluent + annotate-snippets
# pull memchr/pulldown-cmark-escape/anstyle (156 errors). proc-macro
# crates only run host-side at build time anyway.
[target.'cfg(not(target_os = "none"))'.dependencies]
annotate-snippets = "0.11"
fluent-bundle = "0.16"
fluent-syntax = "0.12"
unic-langid = { version = "0.9.0", features = ["macros"] }
