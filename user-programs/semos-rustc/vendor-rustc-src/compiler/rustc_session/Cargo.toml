[package]
name = "rustc_session"
version = "0.0.0"
edition = "2024"

[dependencies]
# tidy-alphabetical-start
rand = { version = "0.9.0", default-features = false }
rustc_abi = { path = "../rustc_abi" }
rustc_ast = { path = "../rustc_ast" }
rustc_data_structures = { path = "../rustc_data_structures" }
rustc_error_messages = { path = "../rustc_error_messages" }
rustc_errors = { path = "../rustc_errors" }
rustc_feature = { path = "../rustc_feature" }
rustc_fluent_macro = { path = "../rustc_fluent_macro" }
rustc_fs_util = { path = "../rustc_fs_util" }
rustc_hashes = { path = "../rustc_hashes" }
rustc_hir = { path = "../rustc_hir" }
rustc_lint_defs = { path = "../rustc_lint_defs" }
rustc_macros = { path = "../rustc_macros" }
rustc_serialize = { path = "../rustc_serialize" }
rustc_span = { path = "../rustc_span" }
rustc_target = { path = "../rustc_target" }
tracing = { version = "0.1", default-features = false }
# tidy-alphabetical-end

# Phase 5b Stage E iter 8: host-only — these are CLI / terminal concerns
# that don't apply when semos-rustc runs as a Ring-3 program. getopts
# parses argv into options (we use a different argv path on SemOS);
# termize queries terminal size (no terminal on SemOS Ring 3 v1).
[target.'cfg(not(target_os = "none"))'.dependencies]
getopts = "0.2"
termize = "0.2"

# Stage F9: many config/option modules now route through semos_std.
[target.'cfg(target_os = "none")'.dependencies]
semos-std = { path = "../../../../std-shim" }

[target.'cfg(unix)'.dependencies]
# tidy-alphabetical-start
libc = "0.2"
# tidy-alphabetical-end

[target.'cfg(windows)'.dependencies.windows]
version = "0.61.0"
features = [
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
]
