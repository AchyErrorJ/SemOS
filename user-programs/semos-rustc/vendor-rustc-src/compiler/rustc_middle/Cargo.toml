[package]
name = "rustc_middle"
version = "0.0.0"
edition = "2024"

[dependencies]
# tidy-alphabetical-start
bitflags = { version = "2.4.1", default-features = false }
either = { version = "1.5.0", default-features = false }
hashbrown = { version = "0.15", default-features = false, features = ["default-hasher"] }
rustc_abi = { path = "../rustc_abi" }
rustc_apfloat = "0.2.0"
# Phase 5b Stage E iter 5: gsgdt 0.1.2 pulls serde without default-features
# = false, which forces serde/std workspace-wide (cargo feature unification).
# gsgdt is used only by mir/{generic_graph, graphviz}.rs which produce MIR
# dump output for debugging — host-only. Cfg-gate accordingly.
rustc_arena = { path = "../rustc_arena" }
rustc_ast = { path = "../rustc_ast" }
rustc_ast_ir = { path = "../rustc_ast_ir" }
rustc_data_structures = { path = "../rustc_data_structures" }
rustc_error_messages = { path = "../rustc_error_messages" } # Used for intra-doc links
rustc_errors = { path = "../rustc_errors" }
rustc_feature = { path = "../rustc_feature" }
rustc_fluent_macro = { path = "../rustc_fluent_macro" }
rustc_graphviz = { path = "../rustc_graphviz" }
rustc_hashes = { path = "../rustc_hashes" }
rustc_hir = { path = "../rustc_hir" }
rustc_hir_pretty = { path = "../rustc_hir_pretty" }
rustc_index = { path = "../rustc_index" }
rustc_lint_defs = { path = "../rustc_lint_defs" }
rustc_macros = { path = "../rustc_macros" }
rustc_query_system = { path = "../rustc_query_system" }
rustc_serialize = { path = "../rustc_serialize" }
rustc_session = { path = "../rustc_session" }
rustc_span = { path = "../rustc_span" }
rustc_target = { path = "../rustc_target" }
rustc_thread_pool = { path = "../rustc_thread_pool" }
rustc_type_ir = { path = "../rustc_type_ir" }
semos-std = { path = "../../../../std-shim" }
smallvec = { version = "1.8.1", default-features = false, features = ["union", "may_dangle"] }
thin-vec = { version = "0.2.12", default-features = false }
tracing = { version = "0.1", default-features = false }
# tidy-alphabetical-end

# Phase 5b Stage E iter 5: gsgdt forces serde/std via feature unification.
# Host-only since the use sites (mir/generic_graph.rs + mir/graphviz.rs) are
# debug MIR-dump output paths.
[target.'cfg(not(target_os = "none"))'.dependencies]
polonius-engine = "0.13.0"
gsgdt = "0.1.2"

[features]
# tidy-alphabetical-start
rustc_randomized_layouts = []
# tidy-alphabetical-end
