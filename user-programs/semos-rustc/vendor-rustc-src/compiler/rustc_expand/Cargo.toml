[package]
name = "rustc_expand"
version = "0.0.0"
edition = "2024"
build = false

[lib]
doctest = false

[dependencies]
# tidy-alphabetical-start
hashbrown = { version = "0.15", default-features = false, features = ["inline-more", "default-hasher"] }
rustc_ast = { path = "../rustc_ast" }
rustc_ast_passes = { path = "../rustc_ast_passes" }
rustc_ast_pretty = { path = "../rustc_ast_pretty" }
rustc_attr_parsing = { path = "../rustc_attr_parsing" }
rustc_data_structures = { path = "../rustc_data_structures" }
rustc_error_messages = { path = "../rustc_error_messages" }
rustc_errors = { path = "../rustc_errors" }
rustc_feature = { path = "../rustc_feature" }
rustc_fluent_macro = { path = "../rustc_fluent_macro" }
rustc_hir = { path = "../rustc_hir" }
rustc_lexer = { path = "../rustc_lexer" }
rustc_lint_defs = { path = "../rustc_lint_defs" }
rustc_macros = { path = "../rustc_macros" }
rustc_middle = { path = "../rustc_middle" }
rustc_parse = { path = "../rustc_parse" }
# We must use the proc_macro version that we will compile proc-macros against,
# not the one from our own sysroot.
rustc_proc_macro = { path = "../rustc_proc_macro" }
rustc_serialize = { path = "../rustc_serialize" }
rustc_session = { path = "../rustc_session" }
rustc_span = { path = "../rustc_span" }
scoped-tls = { version = "1.0", default-features = false }
# M27 R4 B5: PathBuf in base.rs, expand.rs, module.rs.
semos-std = { path = "../../../../std-shim" }
smallvec = { version = "1.8.1", features = ["union", "may_dangle"] }
thin-vec = { version = "0.2.12", default-features = false }
tracing = { version = "0.1", default-features = false }
# tidy-alphabetical-end
