# M27 Phase 5c Stage G iter 1: cg_clif Cargo.toml patched for SemOS:
#
# - crate-type dylib → rlib: cg_clif statically links into the
#   semos-rustc binary, NOT loaded via `-Z codegen-backend`.
# - versions 0.127.0 → 0.122.0: matches what M26 Session B vendored at
#   compiler/vendor/cranelift-*-0.122.0/ — copied into
#   user-programs/semos-rustc/vendor-externals/cranelift-* (subset:
#   bitset, entity, control so far; rest pending).
# - cranelift-codegen features: drop `std` (use the hashbrown no_std
#   path inside cranelift-codegen) and drop `timing` (uses
#   std::time::Instant). Keep `unwind` (gimli no_std-friendly) and
#   `all-native-arch` (x86 + arm64 + s390x + riscv64).
# - cranelift-native dropped: runtime CPU detection via libc; SemOS
#   target is statically x86_64, no detection needed.
# - cranelift-jit dropped: needs libc mmap + executable pages; SemOS
#   AOT-only via cranelift-object → ELF → SYS_SPAWN.
# - object: drop `std` feature; keep read_core/write/archive/elf.
# - libloading dropped: host-only dynamic-loading; SemOS is static.
# - empty [workspace] header so semos-rustc parent workspace claims
#   this crate via its `vendor-rustc-src/compiler/*` glob.

# [workspace] removed — sibling rustc_* crates in this tree have no
# [workspace] block; cargo claims them via the parent workspace's
# `vendor-rustc-src/compiler/*` glob. Having [workspace] here makes
# cg_clif a competing root and breaks `cargo check`.

[package]
name = "rustc_codegen_cranelift"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["rlib"]

[dependencies]
# These have to be in sync with each other
cranelift-codegen = { version = "0.122.0", default-features = false, features = ["unwind", "all-native-arch"] }
cranelift-frontend = { version = "0.122.0", default-features = false, features = ["core"] }
cranelift-module = { version = "0.122.0", default-features = false, features = ["core"] }
cranelift-object = { version = "0.122.0", default-features = false }
target-lexicon = { version = "0.13", default-features = false }
gimli = { version = "0.31", default-features = false, features = ["write"] }
object = { version = "0.36", default-features = false, features = ["read_core", "write_core", "archive", "elf"] }

indexmap = { version = "2.0.0", default-features = false }
smallvec = { version = "1.8.1", default-features = false }

# M27 Phase 5c Stage G iter 7: cg_clif uses `#![feature(rustc_private)]`
# to consume rustc internal crates. Upstream rustc bootstrap injects
# these via --extern flags. For our cargo-managed semos-rustc workspace
# we must declare them as path deps so cargo resolves them.
#
# rustc_driver is intentionally DROPPED here. Upstream's comment says
# "This prevents duplicating functions and statics that are already part
# of the host rustc process" — it's a host-bootstrap optimisation, not a
# real codegen dep. It also transitively pulls rustc_mir_transform /
# rustc_mir_build / rustc_hir_analysis / rustc_passes which still need
# Phase 5a's alloc prelude sweep. Phase 5b wires rustc_driver back in
# at the semos-rustc binary level (not here).
rustc_middle = { path = "../rustc_middle" }
rustc_abi = { path = "../rustc_abi" }
rustc_ast = { path = "../rustc_ast" }
rustc_codegen_ssa = { path = "../rustc_codegen_ssa" }
rustc_const_eval = { path = "../rustc_const_eval" }
rustc_data_structures = { path = "../rustc_data_structures" }
rustc_errors = { path = "../rustc_errors" }
rustc_fs_util = { path = "../rustc_fs_util" }
rustc_hir = { path = "../rustc_hir" }
rustc_incremental = { path = "../rustc_incremental" }
rustc_index = { path = "../rustc_index" }
rustc_log = { path = "../rustc_log" }
rustc_metadata = { path = "../rustc_metadata" }
rustc_session = { path = "../rustc_session" }
rustc_span = { path = "../rustc_span" }
rustc_symbol_mangling = { path = "../rustc_symbol_mangling" }
rustc_target = { path = "../rustc_target" }

# Phase 5c Stage G iter 1: [patch.crates-io] inherited from parent
# workspace at user-programs/semos-rustc/Cargo.toml. Per cargo: only the
# workspace-root Cargo.toml's [patch.crates-io] is honored, so the
# overrides for cranelift-bitset / cranelift-entity / cranelift-control
# live there, not here.

[features]
# Cranelift JIT path NOT supported on SemOS (requires libc mmap +
# executable pages). All compilation goes through cranelift-object →
# ELF → SYS_SPAWN. `unstable-features` retained as a no-op for the
# rustc test harness which references it.
unstable-features = []
inline_asm_sym = []
unwinding = [] # Not yet included in unstable-features for performance reasons

[package.metadata.rust-analyzer]
rustc_private = true
