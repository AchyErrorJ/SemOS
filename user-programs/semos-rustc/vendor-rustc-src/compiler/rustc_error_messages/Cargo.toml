[package]
name = "rustc_error_messages"
version = "0.0.0"
edition = "2024"

# M27 §1.8: i18n / fluent dropped. The previous external deps
# (fluent-bundle, fluent-syntax, icu_list, icu_locale, intl-memoizer,
# rustc_baked_icu_data, unic-langid, tracing) transitively pulled in
# once_cell / log / stable_deref_trait / rustc-stable-hash —
# none of which are no_std-clean. Per plan §1.8 we hard-code English
# diagnostics and supply local stub types for the public surface
# (FluentArgs, FluentValue, FluentBundle, FluentError, FluentResource,
# FluentType, LanguageIdentifier, langid!). See lib.rs for the stubs.

[dependencies]
# tidy-alphabetical-start
rustc_ast = { path = "../rustc_ast" }
rustc_ast_pretty = { path = "../rustc_ast_pretty" }
rustc_data_structures = { path = "../rustc_data_structures" }
rustc_macros = { path = "../rustc_macros" }
rustc_serialize = { path = "../rustc_serialize" }
rustc_span = { path = "../rustc_span" }
# tidy-alphabetical-end

# Stage F3: lib.rs / diagnostic_impls.rs import semos_std::{io,path}.
[target.'cfg(target_os = "none")'.dependencies]
semos-std = { path = "../../../../std-shim" }
