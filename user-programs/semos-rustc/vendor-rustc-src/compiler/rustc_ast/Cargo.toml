# M27 Phase 2b B1: opt out of any parent workspace (Cargo otherwise walks up
# to the worktree root and tries to resolve dev-deps from an unrelated tree).
[package]
name = "rustc_ast"
version = "0.0.0"
edition = "2024"

[dependencies]
# tidy-alphabetical-start
bitflags = "2.4.1"
memchr = { version = "2.7.6", default-features = false }
rustc-literal-escaper = "0.0.7"
rustc_ast_ir = { path = "../rustc_ast_ir" }
rustc_data_structures = { path = "../rustc_data_structures" }
rustc_index = { path = "../rustc_index" }
rustc_macros = { path = "../rustc_macros" }
rustc_serialize = { path = "../rustc_serialize" }
rustc_span = { path = "../rustc_span" }
smallvec = { version = "1.8.1", features = ["union", "may_dangle"] }
thin-vec = { version = "0.2.12", default-features = false }
tracing = { version = "0.1", default-features = false }
# tidy-alphabetical-end
