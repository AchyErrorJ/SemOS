[package]
name = "rustc_type_ir"
version = "0.0.0"
edition = "2024"

[dependencies]
# tidy-alphabetical-start
arrayvec = { version = "0.7", default-features = false }
bitflags = "2.4.1"
derive-where = "1.2.7"
# Phase 5b Stage E iter 6: ena pulls `log` 0.4 with default features
# (no_std-incompatible). Host-only since ena's use is internal to
# rustc_infer's UnificationTable (algorithmic, not target-coupled);
# the no_std target can substitute or stub the unification at site.
indexmap = "2.0.0"
rustc-hash = { version = "2.0.0", default-features = false }
rustc_ast_ir = { path = "../rustc_ast_ir", default-features = false }
rustc_data_structures = { path = "../rustc_data_structures", optional = true }
rustc_error_messages = { path = "../rustc_error_messages", optional = true }
rustc_index = { path = "../rustc_index", default-features = false }
rustc_macros = { path = "../rustc_macros", optional = true }
rustc_serialize = { path = "../rustc_serialize", optional = true }
rustc_span = { path = "../rustc_span", optional = true }
rustc_type_ir_macros = { path = "../rustc_type_ir_macros" }
smallvec = { version = "1.8.1", default-features = false, features = ["const_generics"] }
thin-vec = { version = "0.2.12", default-features = false }
tracing = { version = "0.1", default-features = false }
# tidy-alphabetical-end

# Phase 5b Stage E iter 6: ena host-only — see comment above the ena line.
[target.'cfg(not(target_os = "none"))'.dependencies]
ena = "0.14.3"

[features]
# tidy-alphabetical-start
default = ["nightly"]
nightly = [
    "dep:rustc_data_structures",
    "dep:rustc_error_messages",
    "dep:rustc_macros",
    "dep:rustc_serialize",
    "dep:rustc_span",
    "rustc_ast_ir/nightly",
    "rustc_index/nightly",
    "rustc_type_ir_macros/nightly",
    "smallvec/may_dangle",
    "smallvec/union",
]
# tidy-alphabetical-end
