[package]
name = "rustc_parse"
version = "0.0.0"
edition = "2024"

# M27 R4 B5: on the SemOS target, lib.rs/errors.rs route Path/PathBuf and
# fs::read through `semos_std::*`. The dependency edge is added by the parent
# integrator's workspace patch (same pattern as rustc_fs_util / rustc_span);
# no semos_std entry is declared here so host builds (rustdoc, host-cargo-test)
# stay clean. See docs/m27-port/3a/C1-parse.md for routing details.

[dependencies]
# tidy-alphabetical-start
bitflags = "2.4.1"
rustc-literal-escaper = "0.0.7"
rustc_ast = { path = "../rustc_ast" }
rustc_ast_pretty = { path = "../rustc_ast_pretty" }
rustc_data_structures = { path = "../rustc_data_structures" }
rustc_errors = { path = "../rustc_errors" }
rustc_feature = { path = "../rustc_feature" }
rustc_fluent_macro = { path = "../rustc_fluent_macro" }
rustc_index = { path = "../rustc_index" }
rustc_lexer = { path = "../rustc_lexer" }
rustc_macros = { path = "../rustc_macros" }
rustc_session = { path = "../rustc_session" }
rustc_span = { path = "../rustc_span" }
thin-vec = { version = "0.2.12", default-features = false }
tracing = { version = "0.1", default-features = false }
unicode-normalization = { version = "0.1.25", default-features = false }
unicode-width = "0.2.2"
# tidy-alphabetical-end

# Stage F10: lib.rs/errors.rs need semos_std on the SemOS target, and
# the fluent macro now emits `rustc_error_messages::*` references.
[target.'cfg(target_os = "none")'.dependencies]
rustc_error_messages = { path = "../rustc_error_messages" }
semos-std = { path = "../../../../std-shim" }

[dev-dependencies]
# tidy-alphabetical-start
# tidy-alphabetical-end
