[package]
name = "rustc_public"
version = "0.1.0-preview"
edition = "2024"

[dependencies]
# tidy-alphabetical-start
rustc_abi = { path = "../rustc_abi" }
rustc_hir = { path = "../rustc_hir" }
rustc_middle = { path = "../rustc_middle" }
rustc_public_bridge = { path = "../rustc_public_bridge" }
rustc_session = { path = "../rustc_session" }
rustc_span = { path = "../rustc_span" }
rustc_target = { path = "../rustc_target" }
scoped-tls = { version = "1.0", default-features = false }
serde = { version = "1.0.125", default-features = false, features = ["derive", "alloc"] }
tracing = { version = "0.1", default-features = false }
# tidy-alphabetical-end

[dev-dependencies]
# tidy-alphabetical-start
serde_json = { version = "1.0.142", default-features = false, features = ["alloc"] }
# tidy-alphabetical-end

[features]
# tidy-alphabetical-start
# Provides access to APIs that expose internals of the rust compiler.
# APIs enabled by this feature are unstable. They can be removed or modified
# at any point and they are not included in the crate's semantic versioning.
rustc_internal = []
# tidy-alphabetical-end
