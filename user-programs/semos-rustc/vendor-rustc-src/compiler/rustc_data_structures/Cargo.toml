[package]
name = "rustc_data_structures"
version = "0.0.0"
edition = "2024"

# M27 §1 + R4 B2/B3/B4: pruned dep list for the SemOS target.
# - rustc_thread_pool stubbed in-place (see ../rustc_thread_pool/src/lib.rs).
# - jobserver / parking_lot / measureme / tempfile / stacker / memmap2 are
#   needed for host builds (cfg(not(target_os = "none"))) but are stubbed
#   on the SemOS target inside the affected source files. Cargo.toml keeps
#   them in the build graph so the host build path stays unchanged; the
#   parent vendor patches will retain default-features = false on the
#   transitive crates where required.
# - rustc-stable-hash 0.1.0 is unconditionally std; flagged by the probe.
[dependencies]
# tidy-alphabetical-start
arrayvec = { version = "0.7", default-features = false }
bitflags = "2.4.1"
either = { version = "1.0", default-features = false }
elsa = "1.11.0"
ena = "0.14.3"
indexmap = { version = "2.12.1", default-features = false }
jobserver_crate = { version = "0.1.28", package = "jobserver" }
measureme = "12.0.1"
parking_lot = "0.12"
rustc-hash = { version = "2.0.0", default-features = false }
rustc-stable-hash = { version = "0.1.0", features = ["nightly"] }
rustc_arena = { path = "../rustc_arena" }
rustc_graphviz = { path = "../rustc_graphviz" }
rustc_hashes = { path = "../rustc_hashes" }
rustc_index = { path = "../rustc_index", package = "rustc_index" }
rustc_macros = { path = "../rustc_macros" }
rustc_serialize = { path = "../rustc_serialize" }
rustc_thread_pool = { path = "../rustc_thread_pool" }
smallvec = { version = "1.8.1", default-features = false, features = ["const_generics", "union", "may_dangle"] }
thin-vec = { version = "0.2.12", default-features = false }
tracing = { version = "0.1", default-features = false }
# tidy-alphabetical-end

# Host-only deps — these need C compilers (stacker uses psm via cc-rs) or
# libc-style FS surface (tempfile). On SemOS target, stack.rs's
# ensure_sufficient_stack falls back to a no-op (A1's M27 R4 B3 shim);
# tempfile sites should be cfg-gated where they exist.
[target.'cfg(not(target_os = "none"))'.dependencies]
stacker = "0.1.17"
tempfile = "3.2"

[dependencies.hashbrown]
version = "0.16.1"
default-features = false
features = ["nightly", "default-hasher"] # for may_dangle + Default/Clone hasher

[target.'cfg(windows)'.dependencies.windows]
version = "0.61.0"
features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
]

[target.'cfg(unix)'.dependencies]
# tidy-alphabetical-start
libc = "0.2"
# tidy-alphabetical-end

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# tidy-alphabetical-start
memmap2 = "0.2.1"
# tidy-alphabetical-end

[target.'cfg(not(target_has_atomic = "64"))'.dependencies]
portable-atomic = "1.5.1"
