# M27 SemOS fork of ena 0.14.4 — patched for no_std.
# Drops the `log` dep (the upstream `debug!()` calls are replaced with a
# no-op macro in lib.rs); keeps `dogged` gated behind the `persistent`
# feature (off by default; rustc_infer doesn't enable it).

[package]
name = "ena"
version = "0.14.4"
edition = "2015"
authors = ["Niko Matsakis <niko@alum.mit.edu>"]
description = "Union-find, congruence closure, and other unification code. Based on code from rustc."
homepage = "https://github.com/rust-lang/ena"
license = "MIT OR Apache-2.0"
repository = "https://github.com/rust-lang/ena"

[features]
bench = []
persistent = ["dogged"]

[lib]
name = "ena"
path = "src/lib.rs"

[dependencies]
dogged = { version = "0.2.0", optional = true }
