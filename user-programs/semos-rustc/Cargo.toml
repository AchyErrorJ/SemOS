[package]
name = "semos-rustc"
version = "0.0.1"
edition = "2021"

# semos-rustc is a WORKSPACE ROOT that owns the entire vendored rustc tree.
# Per-crate `[workspace] members = []` headers (added during Phase 2-4 port
# to opt them out of cargo's parent-workspace search) get overridden by
# this root workspace definition via glob membership.
[workspace]
# Phase 5b Stage E iter 9: resolver = "2" enables per-target feature
# resolution. Without it (resolver = "1", the default for edition=2018-
# legacy workspaces), cargo unifies features across the WHOLE workspace —
# meaning a host-only dep's features get propagated to target=x86_64-
# unknown-none resolution. The "tracing's std turns on workspace-wide
# because one consumer forgot df=false" pattern is the iter 7b leak we
# fixed by hand; resolver=2 fixes this category structurally.
resolver = "2"
members = [
    ".",
    "vendor-rustc-src/compiler/*",
]
# rustc_codegen_llvm + rustc_codegen_gcc + rustc_llvm + rustc_baked_icu_data
# + rustc_sanitizers get excluded — per §1 we dropped LLVM/GCC backends,
# the LLVM C++ bindings, ICU data baking, sanitizer support.
#
# Phase 5c Stage G iter 1 (2026-06-04): rustc_codegen_cranelift
# UN-EXCLUDED — picked back into the workspace so its build graph
# (cranelift-codegen / -frontend / -module / -object plus their
# transitives) is now visible to cargo. The Cranelift no_std port is
# expected to span 2-5 iterations; the first iteration lands the
# leaves (cranelift-bitset, -entity, -control) and patches cg_clif's
# Cargo.toml to point at the vendored 0.122.0 copies.
exclude = [
    "vendor-rustc-src/compiler/rustc",
    "vendor-rustc-src/compiler/rustc_codegen_llvm",
    "vendor-rustc-src/compiler/rustc_codegen_gcc",
    "vendor-rustc-src/compiler/rustc_llvm",
    "vendor-rustc-src/compiler/rustc_baked_icu_data",
    "vendor-rustc-src/compiler/rustc_sanitizers",
    "vendor-rustc-src/compiler/rustc_windows_rc",
]

[[bin]]
name = "semos-rustc"
path = "src/main.rs"

[dependencies]
semos-std = { path = "../std-shim" }

# rustc_driver_impl is the M27 Phase 5 integration target — the actual
# rustc CLI entry point. Wires through all 48 ported rustc_* crates
# transitively as path deps from vendor-rustc-src/.
rustc_driver_impl = { path = "vendor-rustc-src/compiler/rustc_driver_impl" }
rustc_driver      = { path = "vendor-rustc-src/compiler/rustc_driver" }

[profile.release]
panic = "abort"
# opt-level=0 only — task #54: any optimization miscompiles the std-shim
# syscall path. Same constraint as every other semos-std consumer.
opt-level = 0
lto = true
strip = true
codegen-units = 1

# Phase 5b Stage E iter 7: [patch.crates-io] overrides for crates whose
# upstream defaults pull no_std-incompatible deps that cargo's transitive
# feature unification can't disable from consumer Cargo.tomls.
#
# tracing-core 0.1.36 — upstream `default = ["std", "valuable?/std"]`
# activates the `std` feature, which pulls once_cell (245 errors against
# x86_64-unknown-none). Our fork changes default = [] so tracing-core
# builds in no_std mode unless a consumer explicitly opts in.
[patch.crates-io]
tracing-core = { path = "vendor-externals/tracing-core" }
# Phase 5b Stage E iter 11: scoped-tls 1.0 fundamentally needs std::
# thread_local. Vendored fork forwards to semos_std::scoped_thread_local!
# on SemOS target (no-op stub on host since real test runs use the
# semos-rustc binary which is target-side).
scoped-tls = { path = "vendor-externals/scoped-tls" }
# Phase 5b Stage E iter 11c: either + indexmap have `default = ["std"]`.
# itertools pulls either without df=false (we can't fix from consumer).
# Forks change default = [].
either = { path = "vendor-externals/either" }
indexmap = { path = "vendor-externals/indexmap" }
# Phase 5b Stage F (rustc_infer): ena (union-find / unification table) is
# host-only upstream because it uses std::sync via the `log` crate. Our
# fork no_std's it and replaces `debug!()` with a no-op macro.
ena = { path = "vendor-externals/ena" }
# Phase 5c Stage G iter 1: Cranelift 0.122.0 vendored from
# compiler/vendor/ (the M26 Session B copy). Three leaves landed this
# iteration: cranelift-bitset is already no_std-clean upstream;
# cranelift-entity is also no_std-clean; cranelift-control's
# default-features list patched to drop the `fuzz` default (upstream's
# `default = ["fuzz"]` pulls `arbitrary v1.4.x` which `impl
# std::error::Error` unconditionally — incompatible with `core`).
# Remaining cranelift-* crates (codegen + frontend + module + object
# + bforest + codegen-shared + assembler-x64 + isle + meta + srcgen +
# native) get added in subsequent Stage G iterations.
cranelift-bitset = { path = "vendor-externals/cranelift-bitset" }
cranelift-entity = { path = "vendor-externals/cranelift-entity" }
cranelift-control = { path = "vendor-externals/cranelift-control" }
# Stage G iter 1b: cranelift-bforest and cranelift-codegen-shared are
# both no_std-clean upstream (bforest declares `#![no_std]` in lib.rs;
# codegen-shared has no `extern crate std` and uses only const tables).
# No patches needed beyond vendoring; the [patch.crates-io] entries
# just point cargo at the local 0.122.0 copies (since cg_clif declares
# 0.122.0 from the registry it would otherwise fetch).
cranelift-bforest = { path = "vendor-externals/cranelift-bforest" }
cranelift-codegen-shared = { path = "vendor-externals/cranelift-codegen-shared" }
# Stage G iter 2: rustc-hash 2.1.2 + memchr 2.8.1 both have `default = ["std"]`.
# Cranelift-codegen (still pulled from registry) asks for them without
# `default-features = false`, so we vendor and drop `std` from defaults.
rustc-hash = { path = "vendor-externals/rustc-hash" }
memchr = { path = "vendor-externals/memchr" }
