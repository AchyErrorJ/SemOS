[package]
name = "semos-rustc"
version = "0.0.1"
edition = "2021"

# semos-rustc is a WORKSPACE ROOT that owns the entire vendored rustc tree.
# Per-crate `[workspace] members = []` headers (added during Phase 2-4 port
# to opt them out of cargo's parent-workspace search) get overridden by
# this root workspace definition via glob membership.
[workspace]
# Phase 5b Stage E iter 9: resolver = "2" enables per-target feature
# resolution. Without it (resolver = "1", the default for edition=2018-
# legacy workspaces), cargo unifies features across the WHOLE workspace —
# meaning a host-only dep's features get propagated to target=x86_64-
# unknown-none resolution. The "tracing's std turns on workspace-wide
# because one consumer forgot df=false" pattern is the iter 7b leak we
# fixed by hand; resolver=2 fixes this category structurally.
resolver = "2"
members = [
    ".",
    "vendor-rustc-src/compiler/*",
]
# rustc_codegen_llvm + rustc_codegen_gcc + rustc_llvm + rustc_baked_icu_data
# + rustc_sanitizers + rustc_codegen_cranelift get excluded — per §1 we
# dropped LLVM/GCC backends, the LLVM C++ bindings, ICU data baking,
# sanitizer support, and we vendor Cranelift separately in semos-cc.
# Also exclude rustc_windows_rc + rustc_public + rustc_public_bridge +
# rustc_proc_macro + rustc_query_impl + rustc_query_system + rustc_traits
# + rustc_transmute + rustc_ty_utils + rustc_next_trait_solver +
# rustc_sanitizers + rustc_symbol_mangling + rustc_pattern_analysis +
# rustc_interface + rustc_target + rustc_abi until we discover whether
# they're transitively needed by rustc_driver_impl (some likely are; this
# is the discovery wave).
exclude = [
    "vendor-rustc-src/compiler/rustc",
    "vendor-rustc-src/compiler/rustc_codegen_llvm",
    "vendor-rustc-src/compiler/rustc_codegen_gcc",
    "vendor-rustc-src/compiler/rustc_codegen_cranelift",
    "vendor-rustc-src/compiler/rustc_llvm",
    "vendor-rustc-src/compiler/rustc_baked_icu_data",
    "vendor-rustc-src/compiler/rustc_sanitizers",
    "vendor-rustc-src/compiler/rustc_windows_rc",
]

[[bin]]
name = "semos-rustc"
path = "src/main.rs"

[dependencies]
semos-std = { path = "../std-shim" }

# rustc_driver_impl is the M27 Phase 5 integration target — the actual
# rustc CLI entry point. Wires through all 48 ported rustc_* crates
# transitively as path deps from vendor-rustc-src/.
rustc_driver_impl = { path = "vendor-rustc-src/compiler/rustc_driver_impl" }
rustc_driver      = { path = "vendor-rustc-src/compiler/rustc_driver" }

[profile.release]
panic = "abort"
# opt-level=0 only — task #54: any optimization miscompiles the std-shim
# syscall path. Same constraint as every other semos-std consumer.
opt-level = 0
lto = true
strip = true
codegen-units = 1

# Phase 5b Stage E iter 7: [patch.crates-io] overrides for crates whose
# upstream defaults pull no_std-incompatible deps that cargo's transitive
# feature unification can't disable from consumer Cargo.tomls.
#
# tracing-core 0.1.36 — upstream `default = ["std", "valuable?/std"]`
# activates the `std` feature, which pulls once_cell (245 errors against
# x86_64-unknown-none). Our fork changes default = [] so tracing-core
# builds in no_std mode unless a consumer explicitly opts in.
[patch.crates-io]
tracing-core = { path = "vendor-externals/tracing-core" }
