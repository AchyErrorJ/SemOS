[build]
target = "x86_64-unknown-none"

[unstable]
build-std = ["core", "compiler_builtins", "alloc"]
build-std-features = ["compiler-builtins-mem"]

# rustc_macros + other rustc tree crates require this — their build.rs's
# refuse to run without it (rustc is normally built via bootstrap which
# sets this internally). M27 Phase 5b Stage E discovery.
[env]
RUSTC_BOOTSTRAP = "1"
