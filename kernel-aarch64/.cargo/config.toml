[build]
target = "aarch64-unknown-none"

[unstable]
build-std = ["core", "alloc", "compiler_builtins"]
build-std-features = ["compiler-builtins-mem"]

[target.aarch64-unknown-none]
# Link with our bare-metal script. aarch64-unknown-none uses rust-lld.
rustflags = ["-C", "link-arg=-Tlinker.ld"]
# Boots a raw binary, not the ELF — QEMU only hands over a DTB on the raw path.
runner = "./qemu-run.sh"
