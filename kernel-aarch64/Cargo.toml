[package]
name = "semantic-os-aarch64"
version = "0.1.0"
edition = "2021"
description = "Semantic OS — aarch64 HAL skeleton (Phase 20 / sovereign-future groundwork)"

# Standalone — kept OUT of the parent x86 workspace (same pattern as kernel-x86_64).
[workspace]

[[bin]]
name = "semantic-os-aarch64"
path = "src/main.rs"

[dependencies]
# The portable OS core — same crate the x86_64 kernel uses. Proves the HAL seam:
# kernel-core compiles + runs on aarch64. (Builds all its no_std deps for ARM too.)
kernel-core = { path = "../kernel-core" }

[profile.release]
panic = "abort"
opt-level = 2
lto = true

[profile.dev]
panic = "abort"
