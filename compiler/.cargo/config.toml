# Use the vendored Cranelift + transitive deps in vendor/ so the build is
# deterministic offline. Generated alongside `cargo vendor` (M26).
[source.crates-io]
replace-with = "vendored-sources"

[source.vendored-sources]
directory = "vendor"

# `semos-compiler` is a HOST tool. Do not force a Windows target here:
# Pop!_OS builds should run as x86_64-unknown-linux-gnu, while Windows devs can
# still pass `--target x86_64-pc-windows-msvc` explicitly if needed.
