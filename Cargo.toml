[workspace]
resolver = "2"
members = [
    "kernel",
    "kernel-bare",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Semantic OS Team"]
license = "MIT OR Apache-2.0"
rust-version = "1.75"

[workspace.dependencies]
# Core
thiserror = "1.0"
tracing = "0.1"

# Crypto
chacha20poly1305 = "0.10"
argon2 = "0.5"
blake2 = "0.10"
hkdf = "0.12"
sha2 = "0.10"
zeroize = { version = "1.7", features = ["derive"] }
rand = "0.8"
getrandom = "0.2"

# Serialization
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"

# Collections
hashbrown = "0.14"
smallvec = "1.11"

# Sync
parking_lot = "0.12"
crossbeam = "0.8"

# Async (hosted mode)
tokio = { version = "1.34", features = ["full"] }

# no_std support
spin = "0.9"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"

[profile.dev]
opt-level = 1
