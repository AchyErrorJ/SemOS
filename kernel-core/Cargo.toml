[package]
name = "kernel-core"
version = "0.1.0"
edition = "2021"
description = "Semantic OS - platform-independent kernel core"

[workspace]

[lib]
name = "kernel_core"
path = "src/lib.rs"

[dependencies]
# No architecture-specific dependencies

[features]
default = []

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
lto = true
codegen-units = 1
