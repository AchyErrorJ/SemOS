[package]
name = "kernel-core"
version = "0.1.0"
edition = "2021"
description = "Semantic OS - platform-independent kernel core"

[workspace]

[lib]
name = "kernel_core"
path = "src/lib.rs"

[dependencies]
# smoltcp — no_std TCP/IP stack for Phase 8 Track B.
# Pinned to 0.11.x per docs/SMOLTCP_VENDORING_BRIEF.md. Default features off;
# enabled features cover what we actually use (Ethernet medium, IPv4, TCP, +
# optionally DNS/DHCP). No alloc — buffers are caller-owned via the
# `Borrowed` ManagedSlice path.
smoltcp = { version = "0.11", default-features = false, features = [
    "medium-ethernet",
    "proto-ipv4",
    "socket-tcp",
    "socket-udp",
] }

# embedded-tls — no_std TLS 1.3 client. VENDORED at vendor/embedded-tls/
# (a copy of crates.io v0.18.0) with one visibility patch on
# `CertificateRef.entries` (pub(crate) → pub) so we can implement
# `TlsVerifier` externally. See vendor/embedded-tls/src/handshake/certificate.rs
# for the patch comment; nothing else is changed.
embedded-tls = { path = "vendor/embedded-tls", default-features = false }

# embedded-io — Read/Write traits embedded-tls uses for its transport.
# Pinned to 0.7 to match what vendored embedded-tls 0.18 expects;
# v0.6 and v0.7 are distinct trait sets even if the surface is
# nearly identical, and TcpStream's impls must align with what TLS
# consumes.
embedded-io = "0.7"

# rand_core / p256 — already transitively pulled in by embedded-tls,
# but kernel-core/src/tls/transport_tls.rs names them directly when
# implementing CryptoProvider (KernelRng impls RngCore + CryptoRng;
# Signature associated type is p256::ecdsa::DerSignature). Pinned
# to match embedded-tls's chosen versions to avoid duplication in
# the binary.
rand_core = { version = "0.6", default-features = false }
p256 = { version = "0.13", default-features = false, features = ["ecdsa"] }

# RustCrypto trait crates — needed for the kernel-core/src/tls/crypto_shim.rs
# wrappers that expose our SHA-256 + ChaCha20-Poly1305 as the traits
# embedded-tls's TlsCipherSuite requires. Versions pinned to whatever
# embedded-tls 0.17 itself uses (visible in Cargo.lock); changing those
# pins requires re-checking against the cipher-suite trait bounds.
digest = { version = "0.10", default-features = false }
aead   = { version = "0.5",  default-features = false }
generic-array = { version = "0.14", default-features = false }
typenum = { version = "1",   default-features = false }
crypto-common = { version = "0.1", default-features = false }
subtle = { version = "2",    default-features = false }

[features]
default = []

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
lto = true
codegen-units = 1
