[package]
name = "kernel-core"
version = "0.1.0"
edition = "2021"
description = "Semantic OS - platform-independent kernel core"

[workspace]

[lib]
name = "kernel_core"
path = "src/lib.rs"

[dependencies]
# smoltcp — no_std TCP/IP stack for Phase 8 Track B.
# Pinned to 0.11.x per docs/SMOLTCP_VENDORING_BRIEF.md. Default features off;
# enabled features cover what we actually use (Ethernet medium, IPv4, TCP, +
# optionally DNS/DHCP). No alloc — buffers are caller-owned via the
# `Borrowed` ManagedSlice path.
smoltcp = { version = "0.11", default-features = false, features = [
    "medium-ethernet",
    "proto-ipv4",
    "socket-tcp",
] }

# embedded-tls — no_std TLS 1.3 client. Per the brief, pin to 0.17 line
# (0.18 may have post-strip-friendly changes; revisit if needed). We'll
# disable default features to keep AES suites etc. out of the binary.
embedded-tls = { version = "0.17", default-features = false }

# embedded-io — Read/Write traits embedded-tls uses for its transport.
# Pin to the same version embedded-tls 0.17 pulls in.
embedded-io = "0.6"

[features]
default = []

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
lto = true
codegen-units = 1
